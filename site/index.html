<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0f1115; color:#d7dae0; font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:900px; margin:0 auto; padding:40px 24px 80px; }
  header { display:flex; flex-wrap:wrap; align-items:baseline; gap:12px 20px; margin-bottom:8px; }
  h1 { font-size:1.5rem; margin:0; }
  #updated { color:#8b93a7; font-size:.8rem; }
  #search { flex:1 1 260px; min-width:200px; background:#161a22; border:1px solid #232838; border-radius:8px;
            color:#d7dae0; font:inherit; padding:9px 14px; outline:none; }
  #search:focus { border-color:#3a4560; }
  .hint { color:#4d5568; font-size:.75rem; margin:4px 0 28px; }
  h2 { font-size:.8rem; color:#8b93a7; text-transform:uppercase; letter-spacing:.08em; margin:34px 0 10px; }
  a { color:#6ea8fe; text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* digests */
  #digests .dg { display:flex; gap:14px; align-items:baseline; padding:7px 0; border-bottom:1px solid #171c29; }
  #digests .dg .d { color:#8b93a7; font-size:.8rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #digests .dg .n { color:#4d5568; font-size:.75rem; white-space:nowrap; }
  #digests .dg .s { color:#a7adbd; font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* tree */
  details { border-left:1px solid #232838; margin:2px 0; }
  details details { margin-left:18px; }
  summary { cursor:pointer; list-style:none; padding:7px 10px; border-radius:6px; display:flex; align-items:center; gap:8px; user-select:none; }
  summary:hover { background:#161a22; }
  summary::before { content:"+"; color:#6ea8fe; font-weight:700; width:14px; display:inline-block; text-align:center; }
  details[open] > summary::before { content:"–"; }
  summary .count { color:#4d5568; font-size:.75rem; margin-left:auto; }
  .entries { list-style:none; margin:0; padding:0 0 4px; }
  .entry { margin-left:18px; padding:6px 10px; border-radius:6px; }
  .entry:hover { background:#161a22; }
  .entry .row { display:flex; gap:12px; align-items:baseline; }
  .entry .date { color:#4d5568; font-size:.75rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .entry .cat { color:#8b93a7; font-size:.72rem; background:#161a22; border:1px solid #232838; border-radius:99px; padding:1px 9px; white-space:nowrap; }
  .entry .sum { color:#a7adbd; font-size:.83rem; margin:2px 0 0; }
  .controls { margin:0 0 6px; }
  .controls button { background:none; border:1px solid #232838; color:#8b93a7; font-size:.72rem; border-radius:6px; padding:3px 10px; cursor:pointer; margin-right:6px; }
  .controls button:hover { color:#d7dae0; border-color:#3a4560; }
  .empty { color:#8b93a7; padding:24px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Catalog</h1>
    <span id="updated"></span>
    <input id="search" type="search" placeholder="search titles, tags, summaries…" autocomplete="off">
  </header>
  <div class="hint">press / to search · esc to clear</div>

  <section id="digest-section" hidden>
    <h2>Daily digests</h2>
    <div id="digests"></div>
  </section>

  <section>
    <h2>Reference pages</h2>
    <div class="controls" id="controls" hidden>
      <button id="expand">expand all</button>
      <button id="collapse">collapse all</button>
    </div>
    <div id="tree"></div>
    <div id="results" hidden></div>
  </section>
</main>

<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let manifest;
  try {
    const res = await fetch("manifest.json?t=" + Date.now());
    if (!res.ok) throw new Error(res.status);
    manifest = await res.json();
  } catch (e) {
    $("#tree").innerHTML = '<div class="empty">Could not load manifest.json — serve this directory over HTTP.</div>';
    return;
  }

  document.title = manifest.site_title || "Catalog";
  $("#title").textContent = manifest.site_title || "Catalog";
  if (manifest.updated) $("#updated").textContent = "updated " + manifest.updated.slice(0, 10);

  const entries = (manifest.entries || []).slice()
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const digests = manifest.digests || [];

  // ── digests ──
  if (digests.length) {
    $("#digest-section").hidden = false;
    $("#digests").innerHTML = digests.slice(0, 10).map((d) =>
      `<div class="dg">
         <span class="d"><a href="${esc(d.path)}">${esc(d.date)}</a></span>
         <span class="n">${d.pages} page${d.pages === 1 ? "" : "s"}</span>
         <span class="s">${esc(d.summary)}</span>
       </div>`).join("");
  }

  // ── tree ──
  const entryHtml = (e, withCat) =>
    `<li class="entry">
       <div class="row">
         <a href="${esc(e.path)}">${esc(e.title)}</a>
         ${withCat ? `<span class="cat">${esc(e.category)}</span>` : ""}
         <span class="date">${esc(e.date)}</span>
       </div>
       <div class="sum">${esc(e.summary)}</div>
     </li>`;

  function buildTree() {
    if (!entries.length) {
      $("#tree").innerHTML = '<div class="empty">Catalog is empty — the first loopwatch run will populate it.</div>';
      return;
    }
    $("#controls").hidden = false;
    const roots = {};
    for (const e of entries) {
      const [top, sub] = (e.category || "misc").split("/");
      roots[top] = roots[top] || { direct: [], subs: {} };
      if (sub) (roots[top].subs[sub] = roots[top].subs[sub] || []).push(e);
      else roots[top].direct.push(e);
    }
    const listHtml = (arr, withCat) => `<ul class="entries">${arr.map((e) => entryHtml(e, withCat)).join("")}</ul>`;
    $("#tree").innerHTML = Object.keys(roots).sort().map((top) => {
      const r = roots[top];
      const total = r.direct.length + Object.values(r.subs).reduce((n, a) => n + a.length, 0);
      const subs = Object.keys(r.subs).sort().map((sub) =>
        `<details><summary>${esc(sub)}<span class="count">${r.subs[sub].length}</span></summary>
           ${listHtml(r.subs[sub], false)}</details>`).join("");
      return `<details><summary>${esc(top)}<span class="count">${total}</span></summary>
                ${subs}${r.direct.length ? listHtml(r.direct, false) : ""}</details>`;
    }).join("");
  }
  buildTree();

  $("#expand").onclick = () => document.querySelectorAll("#tree details").forEach((d) => (d.open = true));
  $("#collapse").onclick = () => document.querySelectorAll("#tree details").forEach((d) => (d.open = false));

  // ── search ──
  const search = $("#search");
  function runSearch() {
    const q = search.value.trim().toLowerCase();
    const showTree = q === "";
    $("#tree").hidden = !showTree;
    $("#controls").hidden = !showTree || !entries.length;
    $("#results").hidden = showTree;
    if (showTree) return;
    const hits = entries.filter((e) =>
      [e.title, e.summary, e.category, ...(e.tags || [])]
        .join(" ").toLowerCase().includes(q));
    $("#results").innerHTML = hits.length
      ? `<ul class="entries">${hits.map((e) => entryHtml(e, true)).join("")}</ul>`
      : '<div class="empty">No matches.</div>';
  }
  search.addEventListener("input", runSearch);
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "/" && document.activeElement !== search) { ev.preventDefault(); search.focus(); }
    if (ev.key === "Escape") { search.value = ""; runSearch(); search.blur(); }
  });
})();
</script>
</body>
</html>
