name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly rot check — catches env drift with zero code changes

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest gates the BSD userland (sed/tail/date/wc differences);
        # ubuntu-latest gates the GNU side + is what the Codespace runs.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ensure jq
        shell: bash
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
      - name: end-to-end smoke test (stubbed claude)
        run: ./test/smoke-test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (error severity)
        run: shellcheck -S error bin/*.sh lib/*.sh test/*.sh test/stubs/claude
