name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # only this job, only to create the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: e2e gate — never release untested
        run: ./test/smoke-test.sh
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # idempotent: no-op if the release was already created manually
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "loopwatch $GITHUB_REF_NAME" \
              --generate-notes
