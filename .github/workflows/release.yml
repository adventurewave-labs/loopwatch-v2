name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: e2e gate — never release untested
        run: ./test/smoke-test.sh
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # idempotent: no-op if the release was already created manually
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "loopwatch $GITHUB_REF_NAME" \
              --generate-notes
